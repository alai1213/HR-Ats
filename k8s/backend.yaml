apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-ats-backend
  namespace: hr-ats
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-ats-backend
  template:
    metadata:
      labels:
        app: hr-ats-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/alai1213/hr-ats-backend:v1.0.1
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hr-ats-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hr-ats-secrets
                  key: JWT_SECRET
            - name: MINIO_ENDPOINT
              value: minio
            - name: MINIO_PORT
              value: '9000'
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hr-ats-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hr-ats-secrets
                  key: MINIO_SECRET_KEY
            - name: CORS_ORIGIN
              value: 'https://hr-ats.company.com'
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /api/docs
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hr-ats-backend
  namespace: hr-ats
spec:
  selector:
    app: hr-ats-backend
  ports:
    - port: 4000
      targetPort: 4000
