---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: hr-ats
data:
  SERVER_PORT: "4000"
  SPRING_DATASOURCE_URL: "jdbc:mariadb://mariadb:3306/hr_ats"
  SPRING_DATASOURCE_USERNAME: "hr_user"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  JWT_EXPIRATION: "86400000"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_BUCKET_NAME: "hr-ats-files"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: hr-ats
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "hr_password"
  JWT_SECRET: "change-me-jwt-secret-hr-ats-2026"
  MINIO_SECRET_KEY: "minioadmin123"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hr-ats
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hr-ats
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hr-ats-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_SECRET_KEY
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
