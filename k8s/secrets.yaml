apiVersion: v1
kind: Secret
metadata:
  name: hr-ats-secrets
  namespace: hr-ats
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me-root-password
  MYSQL_PASSWORD: change-me-hr-password
  DATABASE_URL: mysql://hr_user:change-me-hr-password@mariadb:3306/hr_ats
  JWT_SECRET: change-me-jwt-secret-in-production
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: change-me-minio-secret
